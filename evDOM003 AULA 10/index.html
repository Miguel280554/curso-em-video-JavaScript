<!DOCTYPE html>
<html lang="en">
<head>

    <title>CLIQUE DUPLO</title>

    div#area{
        background: green;
        font: normal 20pt arial;
        width: 500px;
        height: 100px;
        line-height: 100px;

    }
    </style>
</head>
<body>

        function clique(){

    }

    </script>
