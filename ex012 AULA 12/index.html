<html lang="en">
<head>

        body{
            background-color: black;

<body>
    <h1>teste para saber se vota o não</h1>
    <input type="number" name="idade" id="idade">
    <input type="button" value="testar" onclick="cal()">
    <div id="res"></div>
    <script>
        function cal(){
        var txt = window.document.getElementById('idade')
        var rseultado = window.document.getElementById('res')
        var n1 = Number(txt.value)
        if( 16 <= n1 < 18 || n1 >= 67){
            rseultado.innerHTML = 'voto opicional'
        } else if(n1 < 16){
            rseultado.innerHtnl = 'não vota'
        } else if( n1 >= 18){
            rseultado.innerHTML = 'voto obrigatorio'
        }
    }
    </script>
</body>
