<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>verificador de idade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Verificador de Idade</h1>
    </header>

    <section>
        <div id="mensagem">

            ano de nascimento<input type="idade" name="txt1" id="txt1"><br/>
            mes de nascimento<input type="number" name="txt2" id="txt2"><br/>
            dia do nascimento  <input type="number" name="txt3" id="txt3"><br/>
            <div>SEXO:</div>
            <input type="button" value="FEMININO" onclick="femi()">
            <input type="button" value="MASCULINO" onclick="masc()">
        </div>

        <div id="ida">
            sua idade 
        </div>

        <div id="foto">
            <img id="imagem" src="./img/branco.jpg" alt="foto"> 
        </div>

    </section>

    <footer>
        <p>VERIFICADOR DO MIGUEL &copy;</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
