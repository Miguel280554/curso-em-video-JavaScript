<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font: normal 20pt arial;
        }
    </style>
</head>
<body>
    País <input type="text" name="txtn1" id="txtn1">
    <input type="button" value="testar" onclick="calcular()">
    <div id="res"></div>
    
    <script>
        var pais = 'Brasil'

        function calcular(){
            var a = window.document.getElementById('txtn1')
            var res = document.getElementById('res')
            var a1 = String(a.value)
            if( a1 !== pais){
                res.innerHTML = 'estrangeiro'
            } else{
                res.innerHTML = 'brasileiro'
            }
        }
    </script>

</body>
</html>
